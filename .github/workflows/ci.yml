name: Desktop tests and Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact runtime and development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install "setuptools==84.2.1" "pytest==9.2.0" "ruff==0.17.3"
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Static checks
        run: |
          python -m ruff check .
          python scripts/check_distribution.py
      - name: Test security boundaries
        run: python -m pytest -q
      - name: Construct Windows GUI without network or input
        if: runner.os == 'Windows'
        run: python -m twitch_chat_control --smoke-test

  windows-build:
    name: Portable Windows development build
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked build dependencies
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Inspect source packaging boundary
        run: python scripts/check_distribution.py
      - name: Build portable folder from explicit allowlist
        run: python -m PyInstaller packaging/TwitchChatControl.spec --noconfirm --clean
      - name: Inspect built distribution
        run: python scripts/check_distribution.py --dist dist/TwitchChatControl
      - name: Smoke-test packaged app without network or input
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/TwitchChatControl/TwitchChatControl.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Packaged GUI smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged GUI smoke test failed' }
      - name: Archive portable application and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path dist/TwitchChatControl -DestinationPath artifacts/TwitchChatControl-Windows-x64.zip
          $hash = (Get-FileHash artifacts/TwitchChatControl-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TwitchChatControl-Windows-x64.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwitchChatControl-Windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
